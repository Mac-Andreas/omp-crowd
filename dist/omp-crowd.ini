; omp-crowd @VERSION@ - GTA San Andreas's own crowd on open.mp servers that turn it on.
; Goes next to gta_sa.exe, with omp-crowd.dll. Without this file the DLL does nothing.
; The server decides: the crowd only runs where it says "crowd: yes", and the server
; sets the density and the limits. These are your own switches.

[world]
; 0 switches it off everywhere
enabled=1
; GTA's pedestrians / its traffic (random cars stay locked)
peds=1
cars=1
; Nothing this close (metres) vanishes when you look away
keep_peds_m=60
keep_cars_m=80
; Wine, CrossOver, Proton: GTA's 4 ms rule never passes there, so peds are made anyway
force_generate=1
; The link to the server (who owns the shared crowd when players are together)
relay=1
; Write omp-crowd.log (what SA-MP patched, crowd counts, the link)
diag=1
